name: Windows Build

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build BambuPlotter
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE\vcpkg"
          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: Install dependencies
        shell: pwsh
        run: |
          $vcpkg = "$env:GITHUB_WORKSPACE\vcpkg\vcpkg.exe"

          & $vcpkg install `
            pkgconf:x64-windows `
            glfw3:x64-windows `
            glew:x64-windows `
            cereal:x64-windows `
            nlopt:x64-windows `
            wxwidgets:x64-windows `
            opencv:x64-windows `
            curl:x64-windows `
            zlib:x64-windows `
            tbb:x64-windows `
            boost-system:x64-windows `
            boost-filesystem:x64-windows `
            boost-thread:x64-windows `
            boost-log:x64-windows `
            boost-locale:x64-windows `
            boost-regex:x64-windows `
            boost-chrono:x64-windows `
            boost-atomic:x64-windows `
            boost-date-time:x64-windows `
            boost-iostreams:x64-windows `
            imath:x64-windows `
            openvdb:x64-windows

      - name: Check dependencies
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows"

          Write-Host "Checking NLopt..."
          if (!(Test-Path "$root\include\nlopt.hpp")) {
            Write-Error "nlopt.hpp not found"
            exit 1
          }
          Write-Host "NLopt OK"

          Write-Host "Checking GLEW..."
          if (!(Test-Path "$root\include\GL\glew.h")) {
            Write-Error "glew.h not found"
            exit 1
          }
          Write-Host "GLEW headers OK"

          Write-Host "Checking OpenVDB..."
          if (!(Test-Path "$root\include\openvdb")) {
            Write-Error "OpenVDB headers not found"
            exit 1
          }
          Write-Host "OpenVDB headers OK"

          Write-Host "Checking Imath..."
          if (!(Test-Path "$root\include\Imath")) {
            Write-Error "Imath headers not found"
            exit 1
          }
          Write-Host "Imath headers OK"

          Write-Host ""
          Write-Host "Installed OpenVDB libraries:"
          Get-ChildItem "$root\lib" -Filter "*openvdb*" -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "Installed GLEW libraries:"
          Get-ChildItem "$root\lib" -Filter "*glew*" -ErrorAction SilentlyContinue

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake `
            -S "$env:GITHUB_WORKSPACE" `
            -B "$env:GITHUB_WORKSPACE\build" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DSLIC3R_GUI=ON `
            -DSLIC3R_BUILD_TESTS=OFF `
            -DSLIC3R_BUILD_SANDBOXES=OFF `
            -DSLIC3R_ASAN=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake `
            --build "$env:GITHUB_WORKSPACE\build" `
            --config Release `
            --parallel

      - name: Find executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\build" `
            -Recurse `
            -Filter "BambuPlotter.exe" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $exe) {
            Write-Error "BambuPlotter.exe was not created."
            exit 1
          }

          Write-Host "BambuPlotter found:"
          Write-Host $exe.FullName

      - name: Prepare artifact
        shell: pwsh
        run: |
          $package = "$env:GITHUB_WORKSPACE\BambuPlotter-Windows"

          New-Item `
            -ItemType Directory `
            -Path $package `
            -Force | Out-Null

          $exe = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\build" `
            -Recurse `
            -Filter "BambuPlotter.exe" `
            -ErrorAction Stop |
            Select-Object -First 1

          Copy-Item `
            $exe.FullName `
            "$package\BambuPlotter.exe" `
            -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BambuPlotter-Windows
          path: BambuPlotter-Windows
          if-no-files-found: error
