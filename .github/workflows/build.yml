name: Windows Build

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build BambuPlotter
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = "$env:GITHUB_WORKSPACE\vcpkg"
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$vcpkgRoot"
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        shell: pwsh
        run: |
          $vcpkg = "$env:GITHUB_WORKSPACE\vcpkg\vcpkg.exe"
          & $vcpkg install `
            pkgconf:x64-windows `
            glfw3:x64-windows `
            glew:x64-windows `
            cereal:x64-windows `
            nlopt:x64-windows `
            wxwidgets:x64-windows `
            opencv:x64-windows `
            curl:x64-windows `
            zlib:x64-windows `
            tbb:x64-windows `
            boost-system:x64-windows `
            boost-filesystem:x64-windows `
            boost-thread:x64-windows `
            boost-log:x64-windows `
            boost-locale:x64-windows `
            boost-regex:x64-windows `
            boost-chrono:x64-windows `
            boost-atomic:x64-windows `
            boost-date-time:x64-windows `
            boost-iostreams:x64-windows `
            imath:x64-windows `
            openvdb:x64-windows

      - name: Prepare MSVC environment
        shell: pwsh
        run: |
          # setup-msbuild adds MSBuild to PATH, but it does not create a
          # Visual Studio developer environment. CMake/vcpkg need cl.exe,
          # INCLUDE, LIB and the Windows SDK variables as well.
          $vsPath = & vswhere.exe -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($vsPath)) {
            Write-Error 'Visual Studio C++ toolchain was not found.'
            exit 1
          }

          $vsDevCmd = Join-Path $vsPath 'Common7\Tools\VsDevCmd.bat'
          if (!(Test-Path $vsDevCmd)) {
            Write-Error "VsDevCmd.bat was not found: $vsDevCmd"
            exit 1
          }

          Write-Host "Visual Studio: $vsPath"
          Write-Host "Developer command file: $vsDevCmd"

          # Import the complete VS x64 developer environment into this
          # GitHub Actions job so cl.exe is available to following steps.
          $envDump = cmd.exe /d /s /c "`"$vsDevCmd`" -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'VsDevCmd.bat failed.'
            exit 1
          }

          $variables = @('PATH','INCLUDE','LIB','LIBPATH','VCToolsInstallDir','WindowsSdkDir','WindowsSDKVersion','VSINSTALLDIR','VisualStudioVersion')
          foreach ($line in $envDump) {
            foreach ($name in $variables) {
              if ($line -match "^$([regex]::Escape($name))=(.*)$") {
                $value = $matches[1]
                Set-Item -Path "Env:$name" -Value $value
                "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                break
              }
            }
          }

          # Remove MinGW entries that can make CMake's prerequisite checks
          # select objdump/gcc instead of the MSVC toolchain.
          $cleanPath = ($env:PATH -split ';' | Where-Object {
            $_ -and ($_ -notmatch '(?i)mingw')
          }) -join ';'
          $env:PATH = $cleanPath
          "PATH=$cleanPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host 'MSVC compiler:'
          where.exe cl.exe
          if ($LASTEXITCODE -ne 0) {
            Write-Error 'cl.exe is still not available after loading VsDevCmd.bat.'
            exit 1
          }
          cl.exe 2>&1 | Select-Object -First 4

          Write-Host 'CMake:'
          cmake --version

          Write-Host 'Visual Studio generators:'
          cmake --help | Select-String -Pattern 'Visual Studio 17|Visual Studio 18'

      - name: Configure CMake
        shell: pwsh
        run: |
          $buildDir = "$env:GITHUB_WORKSPACE\build"
          if (Test-Path $buildDir) {
            Remove-Item -Path $buildDir -Recurse -Force
          }

          $vcpkgToolchain = "$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake"
          $prefix = "$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows"

          cmake `
            -S "$env:GITHUB_WORKSPACE" `
            -B "$buildDir" `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgToolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_MANIFEST_MODE=OFF `
            -DCMAKE_PREFIX_PATH="$prefix" `
            -DOPENVDB_INCLUDEDIR="$prefix\include" `
            -DOPENVDB_LIBRARYDIR="$prefix\lib" `
            -DSLIC3R_GUI=ON `
            -DSLIC3R_STATIC=OFF `
            -DSLIC3R_BUILD_TESTS=OFF `
            -DSLIC3R_BUILD_SANDBOXES=OFF `
            -DSLIC3R_ASAN=OFF

      - name: Build
        shell: pwsh
        run: |
          cmake `
            --build "$env:GITHUB_WORKSPACE\build" `
            --config Release `
            --parallel

      - name: Find executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\build" `
            -Recurse `
            -Filter "BambuPlotter.exe" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $exe) {
            Write-Error "BambuPlotter.exe was not created."
            exit 1
          }

          Write-Host "BambuPlotter found: $($exe.FullName)"
          "BAMBU_PLOTTER_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare artifact
        shell: pwsh
        run: |
          $package = "$env:GITHUB_WORKSPACE\BambuPlotter-Windows"
          if (Test-Path $package) {
            Remove-Item $package -Recurse -Force
          }
          New-Item -ItemType Directory -Path $package -Force | Out-Null

          Copy-Item "$env:BAMBU_PLOTTER_EXE" "$package\BambuPlotter.exe" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\resources" "$package\resources" -Recurse -Force

          Write-Host 'Package contents:'
          Get-ChildItem $package -Recurse | Select-Object FullName

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BambuPlotter-Windows
          path: BambuPlotter-Windows
          if-no-files-found: error
