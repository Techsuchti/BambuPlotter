name: Windows Build

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build BambuPlotter
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:GITHUB_WORKSPACE\vcpkg"

          & "$env:GITHUB_WORKSPACE\vcpkg\bootstrap-vcpkg.bat" -disableMetrics

      - name: Install dependencies
        shell: pwsh
        run: |
          $vcpkg = "$env:GITHUB_WORKSPACE\vcpkg\vcpkg.exe"

          & $vcpkg install `
            pkgconf:x64-windows `
            glfw3:x64-windows `
            glew:x64-windows `
            cereal:x64-windows `
            nlopt:x64-windows `
            wxwidgets:x64-windows `
            opencv:x64-windows `
            curl:x64-windows `
            zlib:x64-windows `
            tbb:x64-windows `
            boost-system:x64-windows `
            boost-filesystem:x64-windows `
            boost-thread:x64-windows `
            boost-log:x64-windows `
            boost-locale:x64-windows `
            boost-regex:x64-windows `
            boost-chrono:x64-windows `
            boost-atomic:x64-windows `
            boost-date-time:x64-windows `
            boost-iostreams:x64-windows `
            imath:x64-windows `
            openvdb:x64-windows

      - name: Verify dependencies
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows"

          Write-Host "========================================"
          Write-Host "Checking dependencies"
          Write-Host "========================================"

          # NLopt
          if (!(Test-Path "$root\include\nlopt.hpp")) {
            Write-Error "NLopt headers not found"
            exit 1
          }
          Write-Host "NLopt: OK"

          # GLEW
          if (!(Test-Path "$root\include\GL\glew.h")) {
            Write-Error "GLEW headers not found"
            exit 1
          }
          Write-Host "GLEW: OK"

          # OpenVDB
          if (!(Test-Path "$root\include\openvdb")) {
            Write-Error "OpenVDB headers not found"
            exit 1
          }
          Write-Host "OpenVDB: OK"

          # Imath
          if (!(Test-Path "$root\include\Imath")) {
            Write-Error "Imath headers not found"
            exit 1
          }
          Write-Host "Imath: OK"

          # TBB
          if (!(Test-Path "$root\include\tbb")) {
            Write-Error "TBB headers not found"
            exit 1
          }
          Write-Host "TBB: OK"

          Write-Host ""
          Write-Host "OpenVDB libraries:"
          Get-ChildItem "$root\lib" -Filter "*openvdb*" -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "GLEW libraries:"
          Get-ChildItem "$root\lib" -Filter "*glew*" -ErrorAction SilentlyContinue

      - name: Configure MSVC environment
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "Preparing MSVC environment"
          Write-Host "========================================"

          # Remove MinGW from PATH.
          # The bundled FindOpenVDB.cmake calls CMake get_prerequisites(),
          # which was previously picking up C:/mingw64/bin/objdump.exe.
          $cleanPath = ($env:PATH -split ';' | Where-Object {
            $_ -and ($_ -notmatch '(?i)mingw')
          }) -join ';'

          $env:PATH = $cleanPath

          # Persist cleaned PATH for following GitHub Actions steps.
          "PATH=$cleanPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

          Write-Host ""
          Write-Host "Checking objdump:"
          $objdump = Get-Command objdump.exe -ErrorAction SilentlyContinue

          if ($null -eq $objdump) {
            Write-Host "No MinGW objdump found in PATH - good."
          }
          else {
            Write-Host "objdump found at: $($objdump.Source)"
          }

          Write-Host ""
          Write-Host "CMake:"
          cmake --version

          Write-Host ""
          Write-Host "Compiler:"
          where.exe cl.exe

      - name: Configure CMake
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "Configuring CMake"
          Write-Host "========================================"

          $buildDir = "$env:GITHUB_WORKSPACE\build"

          # Make absolutely sure we start from a clean CMake cache.
          if (Test-Path $buildDir) {
            Remove-Item `
              -Path $buildDir `
              -Recurse `
              -Force
          }

          cmake `
            -S "$env:GITHUB_WORKSPACE" `
            -B "$buildDir" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_MANIFEST_MODE=OFF `
            -DSLIC3R_GUI=ON `
            -DSLIC3R_BUILD_TESTS=OFF `
            -DSLIC3R_BUILD_SANDBOXES=OFF `
            -DSLIC3R_ASAN=OFF

      - name: Build
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "Building BambuPlotter"
          Write-Host "========================================"

          cmake `
            --build "$env:GITHUB_WORKSPACE\build" `
            --config Release `
            --parallel

      - name: Find executable
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "Searching for BambuPlotter.exe"
          Write-Host "========================================"

          $exe = Get-ChildItem `
            "$env:GITHUB_WORKSPACE\build" `
            -Recurse `
            -Filter "BambuPlotter.exe" `
            -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if ($null -eq $exe) {
            Write-Error "BambuPlotter.exe was not created."
            exit 1
          }

          Write-Host "BambuPlotter found:"
          Write-Host $exe.FullName

          "BAMBU_PLOTTER_EXE=$($exe.FullName)" | Out-File `
            -FilePath $env:GITHUB_ENV `
            -Encoding utf8

      - name: Prepare artifact
        shell: pwsh
        run: |
          $package = "$env:GITHUB_WORKSPACE\BambuPlotter-Windows"

          New-Item `
            -ItemType Directory `
            -Path $package `
            -Force | Out-Null

          Copy-Item `
            "$env:BAMBU_PLOTTER_EXE" `
            "$package\BambuPlotter.exe" `
            -Force

          Write-Host "Package created:"
          Get-ChildItem $package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BambuPlotter-Windows
          path: BambuPlotter-Windows
          if-no-files-found: error
