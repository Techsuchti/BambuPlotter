name: Windows Build

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build BambuPlotter
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = "$env:GITHUB_WORKSPACE\vcpkg"
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$vcpkgRoot"
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed.' }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        shell: pwsh
        run: |
          $vcpkg = "$env:GITHUB_WORKSPACE\vcpkg\vcpkg.exe"
          & $vcpkg install `
            pkgconf:x64-windows glfw3:x64-windows glew:x64-windows cereal:x64-windows `
            nlopt:x64-windows libnoise:x64-windows wxwidgets:x64-windows opencv:x64-windows `
            curl:x64-windows zlib:x64-windows tbb:x64-windows `
            boost-system:x64-windows boost-filesystem:x64-windows boost-thread:x64-windows `
            boost-log:x64-windows boost-locale:x64-windows boost-regex:x64-windows `
            boost-chrono:x64-windows boost-atomic:x64-windows boost-date-time:x64-windows `
            boost-iostreams:x64-windows imath:x64-windows openvdb:x64-windows
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg dependency installation failed.' }

      - name: Prepare MSVC environment
        shell: pwsh
        run: |
          $vsPath = & vswhere.exe -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (!$vsPath) { throw 'Visual Studio C++ toolchain was not found.' }
          $vsDevCmd = Join-Path $vsPath 'Common7\Tools\VsDevCmd.bat'
          $envDump = cmd.exe /d /s /c "`"$vsDevCmd`" -arch=x64 -host_arch=x64 >nul && set"
          if ($LASTEXITCODE -ne 0) { throw 'VsDevCmd.bat failed.' }

          foreach ($name in @('PATH','INCLUDE','LIB','LIBPATH','VCToolsInstallDir','WindowsSdkDir','WindowsSDKVersion','VSINSTALLDIR','VisualStudioVersion')) {
            foreach ($line in $envDump) {
              if ($line -match "^$([regex]::Escape($name))=(.*)$") {
                $value = $matches[1]
                Set-Item "Env:$name" $value
                "$name=$value" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
                break
              }
            }
          }

          $env:PATH = (($env:PATH -split ';' | Where-Object { $_ -and ($_ -notmatch '(?i)mingw') }) -join ';')
          "PATH=$env:PATH" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          where.exe cl.exe
          if ($LASTEXITCODE -ne 0) { throw 'cl.exe is not available.' }
          cl.exe 2>&1 | Select-Object -First 4

      - name: Resolve libnoise
        shell: pwsh
        run: |
          $prefix = "$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows"
          $include = "$prefix\include"
          $libDirs = @("$prefix\lib", "$prefix\debug\lib")

          $release = Get-ChildItem $libDirs[0] -Filter '*.lib' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '(?i)noise' } | Select-Object -First 1
          $debug = Get-ChildItem $libDirs[1] -Filter '*.lib' -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match '(?i)noise' } | Select-Object -First 1

          if (!$release) {
            Write-Host 'Installed release libraries:'
            Get-ChildItem $libDirs[0] -Filter '*.lib' -File | Select-Object Name
            throw "libnoise library not found in $($libDirs[0])"
          }
          if (!(Test-Path "$include\noise")) { throw "libnoise headers not found in $include" }

          Write-Host "libnoise include = $include"
          Write-Host "libnoise release = $($release.FullName)"
          if ($debug) { Write-Host "libnoise debug = $($debug.FullName)" }
          "LIBNOISE_INCLUDE_DIR=$include" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "LIBNOISE_LIBRARY=$($release.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Patch CMake dependency compatibility
        shell: pwsh
        run: |
          $file = "$env:GITHUB_WORKSPACE\CMakeLists.txt"
          $text = Get-Content $file -Raw
          $pattern = 'if\(TARGET \$\{tgt\}\)\s*set_target_properties\(\$\{tgt\} PROPERTIES MAP_IMPORTED_CONFIG_\$\{from_CFG\} \$\{to_Cfg\}\)\s*endif\(\)'
          $replacement = @'
if(TARGET ${tgt})
                get_target_property(_slic3r_alias ${tgt} ALIASED_TARGET)
                if(NOT _slic3r_alias)
                    set_target_properties(${tgt} PROPERTIES MAP_IMPORTED_CONFIG_${from_CFG} ${to_Cfg})
                endif()
            endif()
'@
          if ($text -match $pattern) {
            $text = [regex]::Replace($text, $pattern, $replacement.Trim(), 1)
            Set-Content $file $text -Encoding utf8
            Write-Host 'Patched slic3r_remap_configs() for ALIAS targets.'
          } else {
            Write-Host 'slic3r_remap_configs() already patched or source differs.'
          }

      - name: Configure CMake
        shell: pwsh
        run: |
          $buildDir = "$env:GITHUB_WORKSPACE\build"
          if (Test-Path $buildDir) { Remove-Item $buildDir -Recurse -Force }
          $toolchain = "$env:GITHUB_WORKSPACE\vcpkg\scripts\buildsystems\vcpkg.cmake"
          $prefix = "$env:GITHUB_WORKSPACE\vcpkg\installed\x64-windows"

          cmake -S "$env:GITHUB_WORKSPACE" -B "$buildDir" `
            -G 'Visual Studio 17 2022' -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DVCPKG_MANIFEST_MODE=OFF `
            -DCMAKE_PREFIX_PATH="$prefix" `
            -DLIBNOISE_INCLUDE_DIR="$env:LIBNOISE_INCLUDE_DIR" `
            -DLIBNOISE_LIBRARY="$env:LIBNOISE_LIBRARY" `
            -DOPENVDB_INCLUDEDIR="$prefix\include" `
            -DOPENVDB_LIBRARYDIR="$prefix\lib" `
            -DSLIC3R_GUI=ON -DSLIC3R_STATIC=OFF `
            -DSLIC3R_BUILD_TESTS=OFF -DSLIC3R_BUILD_SANDBOXES=OFF -DSLIC3R_ASAN=OFF
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed.' }

      - name: Build
        shell: pwsh
        run: |
          cmake --build "$env:GITHUB_WORKSPACE\build" --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw 'CMake build failed.' }

      - name: Find executable
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:GITHUB_WORKSPACE\build" -Recurse -Filter 'BambuPlotter.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$exe) { throw 'BambuPlotter.exe was not created.' }
          "BAMBU_PLOTTER_EXE=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "BambuPlotter found: $($exe.FullName)"

      - name: Prepare artifact
        shell: pwsh
        run: |
          $package = "$env:GITHUB_WORKSPACE\BambuPlotter-Windows"
          if (Test-Path $package) { Remove-Item $package -Recurse -Force }
          New-Item $package -ItemType Directory -Force | Out-Null
          Copy-Item $env:BAMBU_PLOTTER_EXE "$package\BambuPlotter.exe" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\resources" "$package\resources" -Recurse -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BambuPlotter-Windows
          path: BambuPlotter-Windows
          if-no-files-found: error
